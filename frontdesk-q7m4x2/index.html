<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WHCP Front Desk</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WHCP Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F2ED">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a front-desk tablet app. Paper ground, navy ink, one seal blue for actions.
   Big touch targets, one job per screen, header with the time on every screen. Single theme by choice. */
:root{
  color-scheme:light;
  --paper:#F4F2ED; --card:#FFFFFF; --ink:#10233F; --soft:#5A6478; --blue:#0757A7; --sky:#E3EEFB;
  --line:rgba(16,35,63,.18); --warn:#9A3412; --warnbg:#FDEBDD; --ok:#1E6B3A; --okbg:#E1F2E6;
  --display:'Chakra Petch','Eurostile','Arial Narrow',Arial,sans-serif;
  --body:'Jost','Avenir Next','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:20px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{min-height:100%;display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) calc(clamp(16px,4vw,48px) + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(clamp(16px,4vw,48px) + env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--ink);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:60px;height:60px}
.brand b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.brand span{display:block;font-family:var(--display);font-weight:600;font-size:19px}
.lead{display:flex;align-items:center;gap:18px}
.brand.sm{gap:12px;padding-left:18px;border-left:1px solid var(--line)}
.brand.sm img{width:52px;height:52px}
.brand.sm b{font-size:20px}
.brand.sm span{font-size:16px}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--soft);margin-top:3px;letter-spacing:.01em}
.brand.sm small{font-size:12px}
.ttl{font-size:26px;flex:1;text-align:center}
@media (max-width:980px){.brand.sm div{display:none}.brand.sm{padding-left:14px}}
#app{position:relative;isolation:isolate}
#app::before{content:'';position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(70vmin,620px);height:min(70vmin,620px);background:var(--seal) center/contain no-repeat;opacity:.06;pointer-events:none;z-index:-1}
.clock{text-align:right;font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.clock em{font-style:normal;font-size:18px;color:var(--soft);margin-left:4px}
.clock small{display:block;font-family:var(--body);font-weight:400;font-size:17px;color:var(--soft);margin-top:4px}
.back{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px 0 12px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;font-weight:500}
.back svg{width:22px;height:22px}
main{flex:1;display:flex;flex-direction:column;padding-top:22px;min-height:0}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px;margin-top:18px;border-top:1px solid var(--ink);font-size:17px;color:var(--soft)}
.linkbtn{background:none;border:0;padding:8px 4px;min-height:44px;color:var(--soft);text-decoration:underline;font-size:17px}

/* home */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px}
.home h1{font-size:clamp(40px,6vw,62px)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:32px 36px;min-height:250px;border-radius:22px;text-align:left;border:2px solid var(--ink)}
.choice svg{width:58px;height:58px}
.choice b{font-family:var(--display);font-size:44px;line-height:1}
.choice span{font-size:23px;font-weight:300;line-height:1.35}
.choice.c-fam{background:var(--ink);color:var(--paper)}
.choice.c-fam span{color:#C9CFDA}
.choice.c-stf{background:var(--card)}
.choice.c-stf span{color:var(--soft)}
.staffbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:22px;padding:18px 22px;border-radius:18px;background:var(--card);border:1.5px solid var(--line)}
.sb-l{display:flex;align-items:center;gap:14px}
.sb-l svg{width:36px;height:36px;flex:none}
.sb-l b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.sb-l span{display:block;font-size:17px;color:var(--soft)}
.sb-r{display:flex;align-items:center;gap:14px}
.sb-go{background:var(--ink)}
.sideseg button{min-width:150px;min-height:56px;font-size:22px}

/* shared bits */
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:4px}
.seg button{min-height:50px;padding:0 26px;border:0;border-radius:999px;background:transparent;font-family:var(--display);font-weight:600;font-size:21px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.card{background:var(--card);border-radius:20px;padding:24px 26px;box-shadow:0 1px 0 rgba(16,35,63,.05),0 10px 28px rgba(16,35,63,.07)}
.btn{min-height:64px;padding:0 26px;border-radius:16px;border:0;background:var(--blue);color:#fff;font-family:var(--display);font-weight:700;font-size:24px}
.btn:disabled{background:#B7C3D3;color:#F4F6F9;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.btn.small{min-height:48px;font-size:19px;padding:0 18px;border-radius:12px}
.btn.danger{background:var(--card);color:var(--warn);border:2px solid var(--warn)}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:16px;font-weight:500;white-space:nowrap}
.pill.here{background:var(--sky);color:var(--blue)}
.pill.gone{background:#ECEAE4;color:var(--soft)}
.pill.none{background:transparent;color:var(--soft);border:1px solid var(--line)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:18px;font-weight:500}
.input{min-height:56px;padding:0 16px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card);font-size:21px;width:100%}
textarea.input{padding:12px 16px;min-height:120px;line-height:1.4}
.hint{font-size:17px;color:var(--soft)}
.err{color:var(--warn);font-size:18px;font-weight:500;min-height:24px}
.banner{margin:0 0 14px;padding:12px 16px;border-radius:12px;background:var(--warnbg);color:var(--warn);font-size:18px}

/* families */
.fam{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:28px}
@media (max-width:860px){.fam{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
.search{position:relative}
.search svg{position:absolute;left:16px;top:16px;width:24px;height:24px}
.search .input{padding-left:52px}
.kids{display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:52vh;padding:2px}
.kid{display:flex;align-items:center;gap:14px;min-height:74px;padding:0 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);text-align:left;width:100%}
.kid[aria-pressed="true"]{border:2px solid var(--blue);background:#F6FAFE}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:#DDE2EA;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:17px}
.kid[aria-pressed="true"] .av{background:var(--blue);color:#fff}
.kid .nm{flex:1;min-width:0}
.kid .nm b{display:block;font-weight:500;font-size:22px}
.kid .nm span{display:block;font-size:17px;color:var(--soft)}
.tick{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.kid[aria-pressed="true"] .tick{background:var(--blue);border-color:var(--blue);color:#fff}
.confirm{display:flex;flex-direction:column;gap:16px}
.adults{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.adult{display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);text-align:left}
.adult[aria-pressed="true"]{border:2px solid var(--blue);background:#F6FAFE}
.adult .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--soft)}
.adult[aria-pressed="true"] .dot{border:7px solid var(--blue)}
.adult b{display:block;font-weight:500}
.adult span{display:block;font-size:16px;color:var(--soft)}
.sigwrap{position:relative;border:1.5px solid rgba(16,35,63,.3);border-radius:14px;background:#FBFAF7;height:170px;touch-action:none}
.signcard{display:flex;flex-direction:column;gap:12px}
.btn.tutbtn{background:var(--ink)}
.tutnote{font-size:14px;color:var(--soft);font-weight:400;font-family:var(--body)}
.signcard .sigwrap{height:190px}
.sigwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sigwrap .line{position:absolute;left:20px;right:20px;bottom:34px;border-top:1px solid rgba(16,35,63,.3);pointer-events:none}
.sigwrap .ph{position:absolute;left:22px;bottom:8px;font-size:16px;color:var(--soft);pointer-events:none}
.empty{padding:26px;border:1.5px dashed var(--line);border-radius:16px;color:var(--soft);text-align:center}

/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.done .ring{width:110px;height:110px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}
.done .ring svg{width:60px;height:60px}
.done h1{font-size:clamp(36px,5vw,54px);max-width:900px}
.done p{font-size:24px;color:var(--soft);margin:0;max-width:820px}

/* staff */
.stf{flex:1;display:grid;grid-template-columns:360px minmax(0,1fr);gap:34px}
@media (max-width:860px){.stf{grid-template-columns:1fr}}
.dots{display:flex;gap:16px;padding:6px 0}
.dots i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pad button{height:78px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);font-family:var(--display);font-weight:600;font-size:32px}
/* portrait tablet: stack things vertically and use the extra height */
@media (orientation:portrait) and (max-width:1100px){
  .top.hasside{display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand clock" "side side";row-gap:18px}
  .top.hasside .brand{grid-area:brand}
  .top.hasside .clock{grid-area:clock}
  .top.hasside .sideseg{grid-area:side;display:flex;width:100%}
  .top.hasside .sideseg button{flex:1;min-height:64px;font-size:24px}
  .home{justify-content:flex-start;padding-top:28px;gap:30px}
  .home h1{font-size:clamp(48px,8vw,72px)}
  .choices{grid-template-columns:1fr;gap:22px}
  .choice{min-height:0;flex:1;padding:36px 40px;justify-content:center}
  .choice b{font-size:52px}
  .choice span{font-size:26px}
  .home .choices{flex:1;display:flex;flex-direction:column}
  .pad button{height:96px;font-size:36px}
  .pinbox{max-width:520px!important;margin-top:24px!important}
  .signcard .sigwrap{height:240px}
}
.pad button.plain{border:0;background:transparent;color:var(--soft);font-family:var(--body);font-size:19px;font-weight:400}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.who{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:20px 24px;background:var(--ink);color:var(--paper);border-radius:20px}
.who .av{width:58px;height:58px;background:var(--blue);color:#fff;font-size:22px}
.who h2{font-size:30px}
.who .meta{font-size:18px;color:#C9CFDA}
.who .st{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;background:rgba(141,184,240,.2);color:#DCE8F8;font-size:17px;font-weight:500}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.acts .btn{min-height:88px;font-size:27px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--soft);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);font-size:17px}
td{padding:10px 10px 10px 0;border-bottom:1px solid rgba(16,35,63,.08);font-size:19px;vertical-align:middle}
td.num,th.num{text-align:right}
tr.today td{color:var(--blue);font-weight:500}

/* office */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{min-height:48px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:6px}
.stats div b{display:block;font-family:var(--display);font-size:44px;line-height:1}
.stats div span{font-size:17px;color:var(--soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scroll{overflow:auto}
.sig{height:38px;width:130px;display:block}
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(16,35,63,.08)}
.it b{font-weight:500}
.it .sub{font-size:16px;color:var(--soft)}
.lockbox{max-width:440px;margin:auto;display:flex;flex-direction:column;gap:16px;width:100%}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:14px 22px;border-radius:14px;font-size:19px;z-index:20}
.toast.bad{background:var(--warn)}
.mono{font-variant-numeric:tabular-nums}
</style>
</head>

<div id="toast" class="toast" hidden></div>

/* ---------- time, always school-local ---------- */
function parts(ms){
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: 'numeric', minute: '2-digit', hour12: false, weekday: 'short' })
    .formatToParts(new Date(ms)).forEach(x => p[x.type] = x.value);
  return { y: +p.year, m: +p.month, d: +p.day, h: (+p.hour) % 24, mi: +p.minute, wd: p.weekday };
}
const dayKey = ms => { const p = parts(ms); return p.y + '-' + String(p.m).padStart(2, '0') + '-' + String(p.d).padStart(2, '0'); };
const keyToUTC = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const shiftKey = (k, n) => { const t = new Date(keyToUTC(k) + n * 864e5); return t.toISOString().slice(0, 10); };
const fmtKey = (k, o) => new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: 'UTC' }, o)).format(new Date(keyToUTC(k)));
const timeOf = ms => new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(new Date(ms));
const mondayOf = k => { const wd = new Date(keyToUTC(k)).getUTCDay(); return shiftKey(k, wd === 0 ? -6 : 1 - wd); };
const hm = mins => { mins = Math.max(0, Math.round(mins)); return Math.floor(mins / 60) + ':' + String(mins % 60).padStart(2, '0'); };
// "8:05 AM" on a given day -> epoch ms (school-local)
function msAt(key, hhmm){
  const [h, m] = hhmm.split(':').map(Number);
  let guess = keyToUTC(key) + (h * 60 + m) * 6e4 + 8 * 36e5;           // PST guess
  for (let i = 0; i < 2; i++){ const p = parts(guess); const diff = ((p.h * 60 + p.mi) - (h * 60 + m)); guess -= diff * 6e4; }
  return guess;
}

/* ---------- state ---------- */
const S = {
  conn: null, dbState: 'loading',     // loading | ready | none | slow | badkey
  today: dayKey(Date.now()),
  children: {}, staff: {}, settings: null, settingsLoaded: false,
  famIn: {}, famOut: {}, clock: {},

/* ---------- the school's Google Sheet ---------- */
const CONN_KEY = 'whcp-desk-connection';
function loadConn(){
  // a one-time link from the sheet script: ...#connect=<code>
  const m = location.hash.match(/connect=([A-Za-z0-9_\-=]+)/);
  if (m){
    try {
      const j = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
      if (j.u && j.k){ saveConn({ u: j.u, k: j.k }); S.justConnected = true; }
    } catch (e) { S.connErr = 'That connection link didn’t work. Run connectionLink again and open the new link.'; }
    history.replaceState(null, '', location.pathname + location.search);
  }
  try { const c = JSON.parse(localStorage.getItem(CONN_KEY) || 'null'); if (c && c.u && c.k) S.conn = c; } catch (e) {}
}
function saveConn(c){ try { localStorage.setItem(CONN_KEY, JSON.stringify(c)); } catch (e) {} S.conn = c; }
function forgetConn(){ try { localStorage.removeItem(CONN_KEY); } catch (e) {} S.conn = null; }
class ApiError extends Error { constructor(code, msg){ super(msg || code); this.code = code; } }
async function api(action, body, conn){
  const c = conn || S.conn; if (!c) throw new ApiError('no_connection');
  let r;
  try {
    r = await fetch(c.u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: c.k, action }, body || {})), redirect: 'follow' });
  } catch (e) { throw new ApiError('offline'); }
  let j; try { j = await r.json(); } catch (e) { throw new ApiError('bad_response'); }
  if (!j.ok) throw new ApiError(j.error || 'server', j.message);
  return j;
}
let pollTimer = 0, loading = false;
async function refresh(){
  if (!S.conn || loading) return;
  loading = true;
  try {
    const j = await api('today');
    S.children = j.children || {}; S.staff = j.staff || {}; S.settings = j.settings && j.settings.salt ? j.settings : null; S.settingsLoaded = true;
    S.famIn = j.famIn || {}; S.famOut = j.famOut || {}; S.clock = j.clock || {};
    S.dbState = 'ready'; S.lastSync = Date.now();
  } catch (e){
    console.warn(e);
    S.dbState = e.code === 'bad_key' ? 'badkey' : (S.lastSync ? 'stale' : 'slow');
  }
  loading = false;
  softRender();
}
function startDb(){
  loadConn();
  if (!S.conn){ S.dbState = 'none'; render(); return; }
  refresh();
  clearInterval(pollTimer); pollTimer = setInterval(refresh, 20000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('hashchange', () => { if (/connect=/.test(location.hash)){ S.dbState = 'loading'; startDb(); goneHome(); } });
function failMsg(e){
  if (e && e.code === 'bad_key') return 'This device’s access key is no longer valid. The office needs to reconnect it.';
  if (e && e.code === 'offline') return 'Couldn’t reach the school’s records. Check the Wi-Fi and try again.';
  return 'Couldn’t save. Try again in a moment.';
}

/* ---------- derived data ---------- */
const activeChildren = () => Object.entries(S.children).filter(([, c]) => c && !c.archived).map(([id, c]) => Object.assign({ id }, c)).sort((a, b) => a.name.localeCompare(b.name));
const activeStaff = () => Object.entries(S.staff).filter(([, s]) => s && !s.archived).map(([id, s]) => Object.assign({ id }, s)).sort((a, b) => a.name.localeCompare(b.name));
const live = evs => Object.entries(evs || {}).filter(([, e]) => e && !e.v).map(([id, e]) => Object.assign({ id }, e));
function childStatus(id){
  const ins = live(S.famIn).filter(e => e.c === id), outs = live(S.famOut).filter(e => e.c === id);
  const all = ins.map(e => Object.assign({ k: 'in' }, e)).concat(outs.map(e => Object.assign({ k: 'out' }, e))).sort((a, b) => a.t - b.t);
  const last = all[all.length - 1];
  return { state: !last ? 'none' : last.k === 'in' ? 'here' : 'gone', last, inE: ins.sort((a, b) => b.t - a.t)[0], outE: outs.sort((a, b) => b.t - a.t)[0] };
}
// Work out a staff member's day from their clock events.
function dayHours(evs, key){
  const list = evs.slice().sort((a, b) => a.t - b.t);
  let st = 'out', start = 0, bStart = 0, work = 0, brk = 0, first = null, lastOut = null, job = 'reg', tut = 0;
  const add = ms => { work += ms; if (job === 'tut') tut += ms; };
  for (const e of list){
    if (e.k === 'in'){ if (st === 'out'){ st = 'in'; start = e.t; job = e.j === 'tut' ? 'tut' : 'reg'; if (first == null) first = e.t; } }
    else if (e.k === 'bs'){ if (st === 'in'){ add(e.t - start); st = 'break'; bStart = e.t; } }
    else if (e.k === 'be'){ if (st === 'break'){ brk += e.t - bStart; st = 'in'; start = e.t; } }
    else if (e.k === 'out'){ if (st === 'in'){ add(e.t - start); } else if (st === 'break'){ brk += e.t - bStart; } st = 'out'; lastOut = e.t; }
  }
  let open = false, missing = false;
  if (st !== 'out'){
    if (key === S.today){ open = true; const now = Date.now(); if (st === 'in') add(now - start); else brk += now - bStart; }
    else missing = true;
  }
  return { st, job, work: work / 6e4, tut: tut / 6e4, brk: brk / 6e4, first, lastOut, open, missing, since: st === 'in' ? start : st === 'break' ? bStart : null };
}
const staffToday = id => dayHours(live(S.clock).filter(e => e.s === id), S.today);
// After saving, show the change straight away; the next refresh confirms it from the sheet.
function localAdd(map, id, ev){ map[id] = ev; }

/* ---------- hashing (PINs and the office passcode are never stored as typed) ---------- */
async function hash(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('whcp:' + ((S.settings && S.settings.salt) || '') + ':' + text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* signature pad: strokes kept in state, drawn to a canvas, stored as a small SVG path */
function setupSig(){
  const cv = $('#sig'); if (!cv) return;
  const wrap = $('#sigwrap'), r = wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const draw = () => {
    ctx.clearRect(0, 0, r.width, r.height); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#10233F';
    S.v.strokes.forEach(st => { ctx.beginPath(); st.forEach((p, i) => { const x = p[0] / 1000 * r.width, y = p[1] / 1000 * r.height; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); if (st.length === 1) ctx.lineTo(st[0][0] / 1000 * r.width + .1, st[0][1] / 1000 * r.height); ctx.stroke(); });
  };
  draw();
  let cur = null;
  const pt = e => { const b = cv.getBoundingClientRect(); return [Math.round((e.clientX - b.left) / b.width * 1000), Math.round((e.clientY - b.top) / b.height * 1000)]; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); if (S.v.err){ S.v.err = ''; const fe = $('#ferr'); if (fe) fe.textContent = ''; } cur = [pt(e)]; S.v.strokes.push(cur); S.v.signing = true; draw(); };
  cv.onpointermove = e => { if (!cur) return; const p = pt(e), l = cur[cur.length - 1]; if (Math.abs(p[0] - l[0]) + Math.abs(p[1] - l[1]) > 6){ cur.push(p); draw(); } };
  const end = () => { if (!cur) return; cur = null; S.v.signing = false; S.lastAct = Date.now(); if (pendingSoft){ /* keep drawing state; refresh text parts only */ refreshKidList(); } };
  cv.onpointerup = end; cv.onpointercancel = end;
}
function sigPath(strokes){
  // scaled to a 300 x 100 box
  return strokes.filter(s => s.length).map(s => s.map((p, i) => (i ? 'L' : 'M') + Math.round(p[0] * .3) + ' ' + Math.round(p[1] * .1)).join('')).join('');
}
const sigLen = strokes => strokes.reduce((n, s) => n + s.length, 0);
function sigSVG(path, cls){
  if (!path || !/^[ML0-9 ]+$/.test(path)) return '<span class="hint">No signature</span>';
  return '<svg class="' + (cls || 'sig') + '" viewBox="0 0 300 100" role="img" aria-label="Signature"><path d="' + path + '" fill="none" stroke="#10233F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

async function famSubmit(){

  if (v.adult == null){ err(v.mode === 'in' ? 'Choose who is dropping off.' : 'Choose who is picking up.'); return; }

  else { name = adults[v.adult].name; relation = adults[v.adult].relation || ''; }

  const names = v.sel.map(id => S.children[id].name.split(' ')[0]);
  const list = names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0];

    sub: (v.mode === 'in' ? 'Dropped off by ' : 'Picked up by ') + name + ' at ' + timeOf(t) + '.' + (other && v.mode === 'out' ? ' Please show your ID at the front desk.' : ' Have a great day!')

const csvCell = v => { let s = String(v == null ? '' : v); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function saveCSV(name, rows){
  try {
    const blob = new Blob(['\ufeff' + toCSV(rows)], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Downloaded ' + name);
  } catch (e){ toast('Couldn\u2019t make the file.', true); }
}
function csvTimes(){
  const o = S.office, mon = o.week, KN = { in: 'Clock in', bs: 'Break start', be: 'Break end', out: 'Clock out' };
  const wd = Object.assign({}, o.weekData || {}); const days = [0, 1, 2, 3, 4, 5, 6].map(i => shiftKey(mon, i)); if (days.includes(S.today)) wd[S.today] = live(S.clock);
  const rows = [['Staff', 'Role', 'Date', 'First in', 'Last out', 'Break minutes', 'Hours worked', 'Hours (decimal)', 'Regular hours (decimal)', 'Tutoring hours (decimal)', 'Note']];
  const names = {}; Object.values(wd).flat().forEach(e => { names[e.s] = e.n; });
  Object.keys(names).sort((a, b) => names[a].localeCompare(names[b])).forEach(id => days.forEach(k => {
    const evs = (wd[k] || []).filter(e => e.s === id); if (!evs.length) return; const h = dayHours(evs, k);
    rows.push([names[id], (S.staff[id] || {}).role || '', k, h.first ? timeOf(h.first) : '', h.lastOut ? timeOf(h.lastOut) : '', Math.round(h.brk), hm(h.work), (h.work / 60).toFixed(2), ((h.work - h.tut) / 60).toFixed(2), (h.tut / 60).toFixed(2), h.missing ? 'No clock-out' : h.open ? 'Still clocked in' : '']);
  }));
  rows.push([]); rows.push(['Every punch']); rows.push(['Staff', 'Date', 'Punch', 'Time', 'Added by office']);
  days.forEach(k => (wd[k] || []).slice().sort((a, b) => a.t - b.t).forEach(e => rows.push([e.n, k, KN[e.k] + (e.j === 'tut' ? ' for tutoring' : ''), timeOf(e.t), e.m ? 'Yes' : ''])));
  saveCSV('WHCP timesheets week of ' + mon + '.csv', rows);
}
function csvLog(){
  const o = S.office, k = o.logDay;
  const ins = k === S.today ? live(S.famIn) : o.logIn || [], outs = k === S.today ? live(S.famOut) : o.logOut || [];
  const rows = [['Date', 'Child', 'Grade', 'Event', 'Time', 'Adult', 'Relationship', 'Not on approved list']];
  ins.map(e => Object.assign({ k: 'Drop-off' }, e)).concat(outs.map(e => Object.assign({ k: 'Pick-up' }, e))).sort((a, b) => a.n.localeCompare(b.n) || a.t - b.t)
    .forEach(e => rows.push([k, e.n, e.g, e.k, timeOf(e.t), e.a, e.r, e.o ? 'Yes' : '']));
  saveCSV('WHCP family log ' + k + '.csv', rows);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = S.v, o = S.office;
  S.lastAct = Date.now();
  if (a === 'home') return goneHome();
  if (a === 'family'){ const d = famDefaults(); if (b.dataset.v) d.mode = b.dataset.v; return go('family', d); }
  if (a === 'staff') return go('staff', { pin: '' });
  if (a === 'side'){ if (b.dataset.v === 's') return go('staff', { pin: '' }); return go('home', {}); }
  if (a === 'office') return go('office');
  if (a === 'mode'){ v.mode = b.dataset.v; v.err = ''; return render(); }
  if (a === 'pick'){ const id = b.dataset.id; v.sel = v.sel.includes(id) ? v.sel.filter(x => x !== id) : v.sel.concat(id); v.adult = null; v.err = ''; return render(); }
  if (a === 'adult'){ const other = $('#other'); if (other) v.other = other.value; v.adult = b.dataset.i === 'other' ? 'other' : +b.dataset.i; v.err = ''; render(); if (v.adult === 'other' && $('#other')) $('#other').focus(); return; }
  if (a === 'clearsig'){ v.strokes = []; return setupSig(); }
  if (a === 'famsubmit') return famSubmit();
  if (a === 'digit'){ if (v.pin.length < 4){ v.pin += b.dataset.v; v.err = ''; render(); if (v.pin.length === 4) pinEntered(); } return; }
  if (a === 'pindel'){ v.pin = v.pin.slice(0, -1); return render(); }
  if (a === 'pinclear'){ v.pin = ''; return render(); }
  if (a === 'clk'){ v.pend = b.dataset.k; v.strokes = []; v.err = ''; return render(); }
  if (a === 'clkcancel'){ v.pend = null; v.strokes = []; v.err = ''; return render(); }
  if (a === 'clkgo'){
    if (sigLen(v.strokes || []) < 6){ v.err = 'Please sign in the box.'; const fe = $('#ferr'); if (fe) fe.textContent = v.err; return; }
    return clockAction(v.pend);
  }
  if (a === 'staffout') return goneHome();
  if (a === 'otab'){ o.tab = b.dataset.v; o.detail = null; return render(); }
  if (a === 'lock'){ o.unlocked = false; return goneHome(); }
  if (a === 'wk'){ o.week = shiftKey(o.week, +b.dataset.v); o.weekData = undefined; o.detail = null; return render(); }
  if (a === 'tdetail'){ o.detail = b.dataset.id || null; return render(); }
  if (a === 'voidpunch'){
    try { await api('void', { id: b.dataset.id }); if (S.clock[b.dataset.id]) S.clock[b.dataset.id] = Object.assign({}, S.clock[b.dataset.id], { v: true }); } catch (err){ return toast(failMsg(err), true); }
    if (b.dataset.day !== S.today) o.weekData = undefined;
    toast('Punch removed.'); return render();
  }
  if (a === 'csvtimes') return csvTimes();
  if (a === 'csvlog') return csvLog();
  if (a === 'disconnect'){ if (b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Tap again to disconnect'; return; } forgetConn(); o.unlocked = false; S.dbState = 'none'; clearInterval(pollTimer); toast('This device is disconnected.'); return goneHome(); }
  if (a === 'editchild'){ o.editChild = b.dataset.id || null; render(); if (o.editChild) $('#cn').focus(); return; }
  if (a === 'editstaff'){ o.editStaff = b.dataset.id || null; render(); if (o.editStaff) $('#sn').focus(); return; }
  if (a === 'archchild' || a === 'archstaff'){
    const isC = a === 'archchild', id = b.dataset.id, nm = (isC ? S.children : S.staff)[id].name;
    if (b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Tap again to remove ' + nm; return; }
    try { await api(isC ? 'saveChild' : 'saveStaff', { id, archived: true }); (isC ? S.children : S.staff)[id] = Object.assign({}, (isC ? S.children : S.staff)[id], { archived: true }); } catch (err){ return toast(failMsg(err), true); }
    if (isC) o.editChild = null; else o.editStaff = null;
    toast(nm + ' removed from the list. Past records are kept.'); return render();
  }
});
document.addEventListener('input', e => {
  S.lastAct = Date.now();
  if (e.target.id === 'q'){ S.v.q = e.target.value; refreshKidList(); }
  if (e.target.id === 'other') S.v.other = e.target.value;
  if (e.target.id === 'logday' && e.target.value){ S.office.logDay = e.target.value; e.target.blur(); render(); }
});
document.addEventListener('submit', async e => {
  e.preventDefault(); S.lastAct = Date.now();
  const f = e.target.dataset.form, val = id => ($('#' + id) ? $('#' + id).value.trim() : '');
  const fail = (id, m) => { const el = $('#' + id); if (el) el.textContent = m; };
  if (f === 'connect'){
    const u = val('cu'), k = val('ck');
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) return fail('oerr', 'Paste the web app address from the script. It starts with https://script.google.com/');
    if (k.length < 16) return fail('oerr', 'Paste the full access key.');
    try { await api('today', {}, { u, k }); } catch (err){ return fail('oerr', err.code === 'bad_key' ? 'That access key isn\u2019t right.' : 'Couldn\u2019t reach that address. Check it and the Wi-Fi.'); }
    saveConn({ u, k }); S.connErr = ''; S.dbState = 'loading'; startDb(); toast('Connected.'); return render();
  }
  if (f === 'setup'){
    const p1 = val('p1'), p2 = val('p2');
    if (p1.length < 6) return fail('oerr', 'Use at least 6 characters.');
    if (p1 !== p2) return fail('oerr', 'The two passcodes don’t match.');
    const salt = uid() + uid();
    S.settings = { salt };                                 // so hash() uses the new salt
    try { const j = await api('settings', { salt, pass: await hash(p1) }); S.settings = j.settings; } catch (err){ S.settings = null; return fail('oerr', failMsg(err)); }
    S.office.unlocked = true; S.office.tab = 'roster'; toast('Passcode saved. Start by adding children and staff.'); return render();
  }
  if (f === 'unlock'){
    if ((await hash(val('pc'))) === S.settings.pass){ S.office.unlocked = true; S.office.tab = 'today'; S.office.detail = null; return render(); }
    $('#pc').value = ''; return fail('oerr', 'That passcode isn’t right.');
  }
  if (f === 'chpass'){
    if ((await hash(val('cp0'))) !== S.settings.pass) return fail('cperr', 'The current passcode isn’t right.');
    const p1 = val('cp1'); if (p1.length < 6) return fail('cperr', 'Use at least 6 characters.'); if (p1 !== val('cp2')) return fail('cperr', 'The new passcodes don’t match.');
    try { const j = await api('settings', { pass: await hash(p1) }); S.settings = j.settings; } catch (err){ return fail('cperr', failMsg(err)); }
    toast('Passcode changed.'); return render();
  }
  if (f === 'child'){
    const name = val('cn'), grade = val('cg');
    if (name.length < 2) return fail('cerr', 'Type the child’s name.');
    const adults = $('#ca').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const m = l.split(/\s+[-–—]\s+/); return { name: m[0].trim(), relation: (m[1] || '').trim() }; }).slice(0, 12);
    if (!adults.length) return fail('cerr', 'Add at least one approved adult.');
    const id = S.office.editChild || uid();
    try { await api('saveChild', { id, name, grade, adults, archived: false }); S.children[id] = { name, grade, adults, archived: false }; } catch (err){ return fail('cerr', failMsg(err)); }
    toast((S.office.editChild ? 'Saved ' : 'Added ') + name + '.'); S.office.editChild = null; return render();
  }
  if (f === 'staff'){
    const name = val('sn'), role = val('sr'), pin = val('sp'), editing = S.office.editStaff;
    if (name.length < 2) return fail('serr2', 'Type the staff member’s name.');
    if (!editing && !/^\d{4}$/.test(pin)) return fail('serr2', 'Set a 4-digit PIN.');
    if (pin && !/^\d{4}$/.test(pin)) return fail('serr2', 'The PIN must be exactly 4 digits.');
    const obj = { name, role, archived: false };
    if (pin){ const h = await hash(pin); if (activeStaff().some(s => s.pin === h && s.id !== editing)) return fail('serr2', 'Someone else already uses that PIN. Choose another.'); obj.pin = h; }
    const id = editing || uid();
    try { await api('saveStaff', Object.assign({ id }, obj)); S.staff[id] = Object.assign({}, S.staff[id] || {}, obj); } catch (err){ return fail('serr2', failMsg(err)); }
    toast((editing ? 'Saved ' : 'Added ') + name + '.'); S.office.editStaff = null; return render();
  }
  if (f === 'addpunch'){
    const id = S.office.detail, s = S.staff[id], k = val('apd'), kind = val('apk'), tm = val('apt');
    if (!id || !k || !tm) return;
    const pz = Object.assign({ id: uid(), s: id, n: s ? s.name : 'Staff', t: msAt(k, tm), m: 1 }, jobOf(kind));
    try { await api('punch', { punches: [pz] }); if (k === S.today) localAdd(S.clock, pz.id, pz); } catch (err){ return toast(failMsg(err), true); }
    if (k !== S.today) S.office.weekData = undefined;
    toast('Punch added.'); return render();
  }
});

/* ---------- after each render ---------- */
function afterRender(){ setupSig(); }

/* ---------- ticking: clock, day change, idle resets ---------- */
let lastMinute = -1;
setInterval(() => {
  const now = Date.now(), p = parts(now);
  const k = dayKey(now);
  if (k !== S.today){ S.today = k; S.famIn = {}; S.famOut = {}; S.clock = {}; refresh(); if (S.view === 'home') render(); }
  if (p.mi !== lastMinute){ lastMinute = p.mi; const c = $('#clk'); if (c){ const t = document.createElement('div'); t.innerHTML = clockHTML(); c.replaceWith(t.firstChild); } }
  const idle = (now - S.lastAct) / 1000;
  if (S.justConnected){ S.justConnected = false; toast('This device is connected to the school\u2019s records.'); }
  if (S.view === 'office' && S.office.unlocked && idle > OFFICE_IDLE){ S.office.unlocked = false; goneHome(); }
  else if ((S.view === 'family' || S.view === 'staff') && idle > KIOSK_IDLE && !S.v.signing) goneHome();
  else if (S.view === 'office' && !S.office.unlocked && idle > KIOSK_IDLE) goneHome();
}, 1000);
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { S.lastAct = Date.now(); }, { passive: true }));

render();
startDb();
</script>
