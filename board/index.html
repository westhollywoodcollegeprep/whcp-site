*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--ink);overflow:hidden;font-family:var(--body)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:center;background:var(--paper);overflow:hidden;cursor:pointer}

/* masthead: stationery, not a nav bar */
.mast{position:absolute;inset:0 80px auto 80px;height:196px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--ink);z-index:5}
.brand{display:flex;align-items:center;gap:30px}
.crest{width:156px;height:156px;border-radius:50%;background:var(--seal) center/cover no-repeat;flex:none}
.wordmark{font-family:var(--mark);font-weight:700;line-height:1.14}
.wordmark strong{display:block;font-size:50px;font-weight:700}
.wordmark span{display:block;font-size:41px}
.now{display:flex;align-items:baseline;gap:34px}
.mini{display:flex;align-items:center;gap:10px;align-self:center}
.mini .g{width:58px;height:58px}
.mini b{font-family:var(--display);font-weight:600;font-size:48px;line-height:1}
.clock{font-family:var(--display);font-weight:700;font-size:84px;line-height:1;font-variant-numeric:tabular-nums}
.clock em{font-family:var(--mark);font-style:normal;font-weight:600;font-size:28px;margin-left:10px;color:var(--ink-soft)}

/* pages */
.pages{position:absolute;inset:196px 0 70px 0}
.page{position:absolute;inset:0;padding:56px 80px 40px;opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 0s linear 1.1s}
.page.on{opacity:1;visibility:visible;transition:opacity 1.1s ease,visibility 0s}
.it{font-family:var(--body);font-style:normal;font-weight:400}
.say{font-size:34px;font-weight:300;line-height:1.45;color:var(--ink)}
.star{color:var(--blue)}

/* 1 today */
.p-today{display:grid;grid-template-columns:1fr 700px;gap:60px;align-items:center}
.p-today .hello{font-family:var(--display);font-weight:600;font-size:76px;line-height:1.08;color:var(--blue);text-wrap:balance}
.p-today h1{font-family:var(--display);font-weight:700;font-size:150px;line-height:1.02;letter-spacing:-.01em;margin:40px 0 0}
.dial{width:650px;height:650px;justify-self:end}

/* 2 sky */
.p-sky{display:grid;grid-template-columns:1fr 520px;grid-template-rows:1fr auto;column-gap:70px;row-gap:26px}
.sky-now{align-self:center}
.sky-temp{font-family:var(--display);font-weight:700;font-size:240px;line-height:.86;letter-spacing:-.02em}
.sky-cond{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.05;margin:26px 0 18px;color:var(--blue)}
.sky-note{font-size:22px;color:var(--ink-soft);margin-top:14px}
.big-g{width:400px;height:400px;align-self:center;justify-self:center}
.sky-now .say{max-width:900px}
.ahead{grid-column:1 / -1;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--rule);padding-top:22px}
.ahead .d{padding-right:20px}
.ahead .n{font-family:var(--mark);font-weight:600;font-size:27px}
.ahead .t{font-family:var(--display);font-weight:700;font-size:60px;line-height:1.15}
.ahead .t small{font-size:38px;font-weight:500;color:var(--ink-soft);margin-left:12px}
.ahead .c{display:flex;align-items:center;gap:12px;font-size:28px;color:var(--ink)}
.ahead .c .g{width:50px;height:50px;flex:none}

/* 3 year */
.p-year{display:flex;flex-direction:column}
.p-year h2,.p-week h2{font-family:var(--display);font-weight:700;font-size:92px;line-height:1.02;letter-spacing:-.005em}
.p-year .sub{font-size:38px;margin:14px 0 40px;color:var(--blue)}
.prog{display:flex;flex-direction:column;flex:1;justify-content:flex-start;gap:52px;border-top:1px solid var(--rule);padding-top:30px}
.row{display:flex;align-items:baseline;gap:18px}
.row .nm{font-family:var(--display);font-weight:600;font-size:46px;line-height:1.1;white-space:nowrap}
.row .dots{flex:1;border-bottom:3px dotted var(--rule);transform:translateY(-10px)}
.row .dt{font-size:36px;white-space:nowrap}
.row .nt{font-family:var(--mark);font-weight:600;font-size:23px;width:230px;text-align:right;white-space:nowrap}
.row .nt.closed{color:var(--blue)}

/* 4 week */
.p-week{display:flex;flex-direction:column}
.week{display:grid;grid-template-columns:repeat(5,1fr);flex:1;align-items:center;margin-top:10px}
.wd{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center}
.wd .n{font-family:var(--display);font-weight:600;font-size:34px}
.wd .num{position:relative;font-family:var(--display);font-weight:700;font-size:190px;line-height:.9;margin:14px 0 22px;width:330px;height:330px;display:flex;align-items:center;justify-content:center}
.wd .what{font-size:29px;font-weight:300;line-height:1.3;max-width:300px;min-height:76px}
.wd.past{opacity:.38}
.wd.off .num{color:transparent;-webkit-text-stroke:2.5px var(--ink)}
.wd.off .what{color:var(--blue);font-weight:400}
.wd.today .num::before{content:"";position:absolute;inset:0;border:3px solid var(--blue);border-radius:50%}
.wd.today .num::after{content:"";position:absolute;inset:12px;border:1px solid var(--blue);border-radius:50%}
.wd.today .n{color:var(--blue)}
.p-week .foot-line{font-size:30px;font-weight:300;text-align:center;color:var(--ink-soft)}

/* 5 word of the day */
.p-word{display:flex;flex-direction:column;justify-content:center;gap:26px}
.p-word .lab{font-family:var(--display);font-weight:600;font-size:34px;color:var(--blue)}
.p-word h2{font-family:var(--display);font-weight:700;font-size:210px;line-height:1.05;letter-spacing:-.01em;white-space:nowrap;overflow:hidden}
.p-word .pos{font-family:var(--display);font-weight:500;font-size:34px;color:var(--ink-soft)}
.p-word .def{font-size:58px;font-weight:400;line-height:1.25}

/* reminders: the one inverse page, written for students */
.p-remind{background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:center;gap:34px}
.p-remind .lab{font-family:var(--display);font-weight:600;font-size:32px;color:#8DB8F0}
.p-remind h2{font-family:var(--display);font-weight:700;font-size:168px;line-height:1;letter-spacing:-.01em;max-width:1640px;text-wrap:balance}
.p-remind p{font-size:46px;font-weight:300;line-height:1.35;color:#C9CFDA;max-width:1300px}

/* silent looping video that helps keep TV players from starting a screensaver; effectively invisible */
.awake{position:absolute;right:0;bottom:0;width:64px;height:36px;opacity:.01;pointer-events:none;z-index:1}

/* footer */
.foot{position:absolute;inset:auto 80px 0 80px;height:70px;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;justify-items:center;
  border-top:1px solid var(--ink);font-family:var(--mark);font-weight:500;font-size:22px;z-index:5}
.foot .site{display:flex;align-items:center;gap:12px}
.foot .fav{display:block;width:38px;height:38px;border-radius:50%;background:var(--seal) center/cover no-repeat}
.foot .bar{display:block;width:1px;height:26px;background:var(--ink);opacity:.45}

/* motion: each page's lines rise in one after another, and each page has one small thing that keeps moving */
.page.on .in{animation:inUp .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 130ms + 250ms)}
@keyframes inUp{from{opacity:0;transform:translateY(28px)}}
#hS{transition:transform 1s linear}
.big-g .rays{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
.big-g .drift{animation:drift 7s ease-in-out infinite alternate}
.big-g .drop{animation:fall 1.4s linear infinite}
.big-g .drop:nth-child(2){animation-delay:.45s}
.big-g .drop:nth-child(3){animation-delay:.9s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@keyframes fall{0%{transform:translate(2px,-6px);opacity:0}25%{opacity:1}100%{transform:translate(-3px,10px);opacity:0}}
.wd.today .num::before{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.045)}}
.p-remind{overflow:hidden}
.p-remind .rings{position:absolute;right:-330px;top:50%;width:1100px;height:1100px;margin-top:-550px;pointer-events:none}
.p-remind .rings circle{fill:none;stroke:#8DB8F0;transform-box:fill-box;transform-origin:center}
.p-remind .rings .r1{opacity:.22;stroke-width:2;stroke-dasharray:3 22;stroke-linecap:round;animation:spin 140s linear infinite}
.p-remind .rings .r2{opacity:.16;stroke-width:1.5;stroke-dasharray:60 30;animation:spin 200s linear infinite reverse}
.p-remind .rings .r3{opacity:.12;stroke-width:1.5}
.p-remind .stroke{display:block;width:620px;height:34px;margin-top:-14px;overflow:visible}
.p-remind .stroke path{fill:none;stroke:#8DB8F0;stroke-width:7;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.page.on.p-remind .stroke path{animation:ink 1.1s cubic-bezier(.4,.1,.2,1) 1.1s forwards}
@keyframes ink{to{stroke-dashoffset:0}}
.p-word h2 span{display:inline-block}
@media (prefers-reduced-motion:reduce){
  .page.on .in,.big-g .rays,.big-g .drift,.big-g .drop,.wd.today .num::before,.p-remind .rings circle{animation:none}
  .p-remind .stroke path{stroke-dashoffset:0;animation:none}
}
</style>
</head>

function laNow(){
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric',
    hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: false }).formatToParts(new Date()).forEach(x => p[x.type] = x.value);
  return { y: +p.year, m: +p.month, d: +p.day, h: (+p.hour) % 24, mi: +p.minute, s: +p.second, n: Date.UTC(+p.year, +p.month - 1, +p.day) };
}
const num = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fmt = (n, o) => new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: 'UTC' }, o)).format(new Date(n));
const EVENTS = CONFIG.calendar.map(e => ({ name: e.name, tag: e.tag, s: num(e.start), e: num(e.end || e.start) })).sort((a, b) => a.s - b.s);
const onDay = n => EVENTS.filter(ev => ev.s <= n && ev.e >= n).sort((a, b) => (a.e - a.s) - (b.e - b.s))[0];

function whenText(ev){
  if (ev.s === ev.e) return fmt(ev.s, { weekday: 'long', month: 'long', day: 'numeric' });
  const same = fmt(ev.s, { month: 'long' }) === fmt(ev.e, { month: 'long' });
  return fmt(ev.s, { month: 'long', day: 'numeric' }) + ' to ' + fmt(ev.e, same ? { day: 'numeric' } : { month: 'long', day: 'numeric' });
}

/* ---------- 1. the hall clock ---------- */
(function buildDial(){
  let s = '<circle r="330" fill="#fff" stroke="' + INK + '" stroke-width="4"/><circle r="314" fill="none" stroke="' + INK + '" stroke-width="1"/>';
  for (let i = 0; i < 60; i++){
    const a = i * Math.PI / 30, c = Math.sin(a), q = -Math.cos(a), big = i % 5 === 0;
    s += '<line x1="' + (c * 304).toFixed(1) + '" y1="' + (q * 304).toFixed(1) + '" x2="' + (c * (big ? 274 : 292)).toFixed(1) + '" y2="' + (q * (big ? 274 : 292)).toFixed(1) +
      '" stroke="' + INK + '" stroke-width="' + (big ? 5 : 1.5) + '"/>';
  }
  [[12, 0, -218], [3, 226, 0], [6, 0, 222], [9, -226, 0]].forEach(([n, x, y]) => {
    s += '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="central" font-family="Chakra Petch,Arial,sans-serif" font-weight="600" font-size="50" fill="' + INK + '">' + n + '</text>';
  });
  s += '<line id="hH" y1="30" y2="-168" stroke="' + INK + '" stroke-width="11" stroke-linecap="round"/>' +
       '<line id="hM" y1="36" y2="-258" stroke="' + INK + '" stroke-width="6.5" stroke-linecap="round"/>' +
       '<line id="hS" y1="54" y2="-278" stroke="' + BLUE + '" stroke-width="2.5" stroke-linecap="round"/>' +
       '<circle r="11" fill="' + INK + '"/><circle r="4.5" fill="' + BLUE + '"/>';
  $('dial').innerHTML = s;
})();
const SEC0 = Math.floor(Date.now() / 60000) * 60;   // so the second hand's angle only ever grows and never snaps back

let lastDay = 0;
function tick(){
  const t = laNow();
  $('hH').setAttribute('transform', 'rotate(' + ((t.h % 12) * 30 + t.mi * .5) + ')');
  $('hM').setAttribute('transform', 'rotate(' + (t.mi * 6 + t.s * .1) + ')');
  $('hS').style.transform = 'rotate(' + (Math.floor(Date.now() / 1000) + 1 - SEC0) * 6 + 'deg)';
  $('clock').innerHTML = (t.h % 12 || 12) + ':' + String(t.mi).padStart(2, '0') + '<em>' + (t.h < 12 ? 'AM' : 'PM') + '</em>';
  $('hello').textContent = (t.h < 12 ? 'Good morning' : t.h < 17 ? 'Good afternoon' : 'Good evening') + ', and welcome.';
  if (t.n !== lastDay){ lastDay = t.n; renderToday(t.n, t.d); renderYear(t.n); renderWeek(t.n); renderWord(t.n); }
  if (WX && t.s === 0) renderSky();
}

function renderToday(today, d){
  $('longDate').innerHTML = fmt(today, { weekday: 'long' }) + '<br>' + fmt(today, { month: 'long', day: 'numeric' });
}

/* ---------- 3. the school year ---------- */
function renderYear(today){
  const up = EVENTS.filter(ev => ev.e >= today), f = up[0];
  if (!f){ $('nextHead').textContent = 'Enjoy the summer.'; $('nextSub').textContent = 'The next school calendar is on its way.'; $('prog').innerHTML = ''; }
  else {
    const d = Math.round((f.s - today) / DAY);
    const nice = NICE[f.name] || f.name, count = (d <= 12 ? WORDS[d] : d) + ' days until ';
    $('nextHead').textContent = f.name === 'School Resumes'
      ? (d <= 0 ? 'School resumes today.' : d === 1 ? 'School resumes tomorrow.' : count + 'school resumes.')
      : d <= 0 ? (f.s === f.e ? 'Today is ' + nice + '.' : f.name + ' is under way.')
      : d === 1 ? 'Tomorrow is ' + nice + '.' : count + nice + '.';
    $('nextSub').textContent = whenText(f) + (f.tag ? '. ' + (f.tag === 'closed' ? 'The school will be closed.' : f.tag === 'short' ? 'A short day.' : 'No classes.') : '.');
    $('prog').innerHTML = up.slice(1, 6).map((ev, i) =>
      '<div class="row in" style="--i:' + (i + 2) + '"><span class="nm">' + ev.name + '</span><span class="dots"></span><span class="it dt">' + whenText(ev) +
      '</span><span class="nt ' + ev.tag + '">' + (NOTE[ev.tag] || '') + '</span></div>').join('');
  }
  buildReminders(today);
}

/* ---------- 4. this week ---------- */
function renderWeek(today){
  const dow = new Date(today).getUTCDay(), mon = today + (dow === 0 ? 1 : dow === 6 ? 2 : 1 - dow) * DAY;
  $('weekHead').textContent = 'The week of ' + fmt(mon, { month: 'long', day: 'numeric' });
  let h = '';
  for (let i = 0; i < 5; i++){
    const n = mon + i * DAY, ev = onDay(n), off = ev && (ev.tag === 'closed' || ev.tag === 'break');
    h += '<div style="--i:' + (i + 1) + '" class="in wd' + (n === today ? ' today' : '') + (off ? ' off' : '') + (n < today ? ' past' : '') + '"><span class="it n">' + fmt(n, { weekday: 'long' }) +
      '</span><span class="num">' + fmt(n, { day: 'numeric' }) + '</span><span class="what">' +
      (ev ? ev.name + (ev.tag ? '<br>' + NOTE[ev.tag] : '') : 'School in session') + '</span></div>';
  }
  $('week').innerHTML = h;
}

const VOCAB = CONFIG.words.slice();
// Shuffle once with a fixed seed, so the order is mixed but the same on every screen and after every restart.
(function(){ let s = 20260908; const rnd = () => { s = (s + 0x6D2B79F5) | 0; let x = Math.imul(s ^ (s >>> 15), 1 | s); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  for (let i = VOCAB.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [VOCAB[i], VOCAB[j]] = [VOCAB[j], VOCAB[i]]; } })();
function renderWord(today){

  const w = VOCAB[Math.round(today / DAY) % VOCAB.length], h = $('wordW');
  h.innerHTML = w[0].split('').map((ch, i) => '<span class="in" style="--i:' + (1 + i * .45) + '">' + ch + '</span>').join(''); $('wordP').textContent = w[1]; $('wordD').textContent = w[2];
  let size = 210; h.style.fontSize = size + 'px';           // shrink long words to fit on one line
  while (h.scrollWidth > h.clientWidth && size > 90){ size -= 6; h.style.fontSize = size + 'px'; }
}


/* ---------- weather glyphs: ink line drawings ---------- */
const CLOUD = 'M36 88h50a19 19 0 0 0 2.5-37.8A27 27 0 0 0 37 44.5 22 22 0 0 0 36 88z';
const LN = 'fill="none" stroke="' + INK + '" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"';
function sun(cx, cy, r){
  let s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" ' + LN + '/><g class="rays">';
  for (let i = 0; i < 8; i++){
    const a = i * Math.PI / 4, c = Math.cos(a), q = Math.sin(a);
    s += '<line x1="' + (cx + c * (r + 9)).toFixed(1) + '" y1="' + (cy + q * (r + 9)).toFixed(1) + '" x2="' + (cx + c * (r + 19)).toFixed(1) + '" y2="' + (cy + q * (r + 19)).toFixed(1) + '" ' + LN + '/>';
  }
  return s + '</g>';
}
const moon = '<path d="M80 76A32 32 0 0 1 48 30a34 34 0 1 0 36 44 32 32 0 0 1-4 2z" ' + LN + '/>';
const cloud = t => '<g transform="' + (t || '') + '"><path class="drift" d="' + CLOUD + '" fill="' + PAPER + '" stroke="' + INK + '" stroke-width="4.5" stroke-linejoin="round"/></g>';
const rain = xs => '<g>' + xs.map(x => '<line class="drop" x1="' + x + '" y1="88" x2="' + (x - 6) + '" y2="104" stroke="' + BLUE + '" stroke-width="4.5" stroke-linecap="round"/>').join('') + '</g>';
const GLYPH = {
  'clear-day': sun(60, 60, 22), 'clear-night': moon,
  'partly-day': sun(42, 44, 14) + cloud('translate(14 16) scale(.84)'),
  'partly-night': '<g transform="translate(-14 -12) scale(.8)">' + moon + '</g>' + cloud('translate(14 16) scale(.84)'),
  'cloudy': cloud(), 'fog': cloud('translate(0 -16)') + '<line x1="30" y1="88" x2="90" y2="88" ' + LN + '/><line x1="42" y1="102" x2="78" y2="102" ' + LN + '/>',
  'drizzle': cloud('translate(0 -18)') + rain([52, 76]), 'rain': cloud('translate(0 -18)') + rain([46, 64, 82]),
  'snow': cloud('translate(0 -18)') + [44, 62, 80].map(x => '<circle cx="' + x + '" cy="96" r="4" fill="' + BLUE + '"/>').join(''),
  'storm': cloud('translate(0 -18)') + '<path d="M64 80 52 98h11l-5 16 17-22H64z" fill="' + BLUE + '"/>'
};
const glyph = k => '<svg viewBox="0 0 120 120" width="100%" height="100%" aria-hidden="true">' + (GLYPH[k] || GLYPH.cloudy) + '</svg>';

function describe(code, isDay){
  const dn = isDay ? 'day' : 'night';
  if (code === 0) return [isDay ? 'Sunny' : 'Clear', 'clear-' + dn];
  if (code === 1) return [isDay ? 'Mostly sunny' : 'Mostly clear', 'clear-' + dn];
  if (code === 2) return ['Partly cloudy', 'partly-' + dn];
  if (code === 3) return ['Overcast', 'cloudy'];
  if (code === 45 || code === 48) return ['Foggy', 'fog'];
  if (code >= 51 && code <= 57) return ['Drizzle', 'drizzle'];
  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return [code >= 80 ? 'Showers' : 'Rain', 'rain'];
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ['Snow', 'snow'];
  if (code >= 95) return ['Thunderstorms', 'storm'];
  return ['Cloudy', 'cloudy'];
}

/* ---------- weather data: Open-Meteo (free, no key) ---------- */
let WX = null;
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.place.lat + '&longitude=' + CONFIG.place.lon +
  '&current=temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m' +
  '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max' +
  '&temperature_unit=fahrenheit&wind_speed_unit=mph&forecast_days=6&timezone=' + encodeURIComponent(TZ);
// On the school's own site the board shows live West Hollywood weather or nothing.
// Anywhere else (a preview), it shows placeholder numbers so the layout can be judged.
const HOSTED = /(^|\.)westhollywoodschool\.com$|\.github\.io$/.test(location.hostname);
function blankWeather(){
  return { live: false, temp: NaN, code: 3, isDay: true, wind: NaN, sunrise: '06:00', sunset: '18:00', uv: NaN, rain: 0,
    days: [0, 1, 2, 3, 4, 5].map(() => ({ code: 3, hi: NaN, lo: NaN })) };
}
function sampleWeather(){
  const codes = [1, 0, 2, 3, 61, 1], hi = [74, 76, 73, 68, 64, 70], lo = [56, 57, 55, 54, 52, 53], h = laNow().h;
  return { live: false, temp: 72, code: 1, isDay: h >= 7 && h < 17, wind: 6, sunrise: '06:19', sunset: '16:53', uv: 4, rain: 5,
    days: codes.map((c, i) => ({ code: c, hi: hi[i], lo: lo[i] })) };
}
async function loadWeather(){
  try {
    const r = await fetch(WX_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('weather ' + r.status);
    const j = await r.json(), c = j.current, d = j.daily;
    WX = { live: true, temp: c.temperature_2m, code: c.weather_code, isDay: !!c.is_day, wind: c.wind_speed_10m,
      sunrise: d.sunrise[0].slice(11, 16), sunset: d.sunset[0].slice(11, 16), uv: d.uv_index_max[0], rain: d.precipitation_probability_max[0],
      days: d.time.map((t, i) => ({ code: d.weather_code[i], hi: d.temperature_2m_max[i], lo: d.temperature_2m_min[i], rain: d.precipitation_probability_max[i] })) };
  } catch (err) { if (!WX || !WX.live) WX = HOSTED ? blankWeather() : sampleWeather(); }
  renderSky();
}
const mins = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const clock12 = hm => { const [h, m] = hm.split(':').map(Number); return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' AM' : ' PM'); };
const deg = v => isFinite(v) ? Math.round(v) + '°' : '--';

/* ---------- 2. the sky ---------- */
function renderSky(){
  const w = WX, [words, kind] = describe(w.code, w.isDay), t0 = w.days[0], now = laNow();
  $('miniG').innerHTML = glyph(kind); $('miniT').textContent = deg(w.temp);
  $('skyT').textContent = deg(w.temp); $('skyC').textContent = isFinite(w.temp) ? words + '.' : 'Weather unavailable.';
  $('skySay').textContent = isFinite(t0.hi) ? 'A high of ' + deg(t0.hi) + ' today and ' + deg(t0.lo) + ' overnight.' : 'The forecast will be back shortly.';

$('skyG').innerHTML = glyph(kind);

  $('ahead').innerHTML = w.days.slice(1, 6).map((dd, i) => {
    const [dw, dk] = describe(dd.code, true);
    return '<div class="d in" style="--i:' + (i + 3) + '"><div class="n">' + fmt(now.n + (i + 1) * DAY, { weekday: 'long' }) + '</div><div class="t">' + deg(dd.hi) + '<small>' + deg(dd.lo) +
      '</small></div><div class="it c"><span class="g">' + glyph(dk) + '</span>' + dw + '</div></div>';
  }).join('');
}

/* ---------- reminders for students ---------- */
const isWet = d => (d.code >= 51 && d.code <= 67) || (d.code >= 80 && d.code <= 82) || d.code >= 95 || d.rain >= 50;
let REMIND = [], rIdx = 0;
function buildReminders(today){
  const auto = [], dow = new Date(today).getUTCDay();
  const soon = EVENTS.find(e => e.s > today && e.s - today <= 3 * DAY && e.tag);
  if (soon){
    const day = soon.s - today === DAY ? 'tomorrow' : 'on ' + fmt(soon.s, { weekday: 'long' });
    auto.push(soon.tag === 'short' ? { big: 'Short day ' + day + '.', small: fmt(soon.s, { weekday: 'long', month: 'long', day: 'numeric' }) + '.' }
                                   : { big: 'No school ' + day + '.', small: soon.name + ', ' + whenText(soon) + '.' });
  }
  // Rain on the next school day: remind everyone the school day before (Friday for a wet Monday).
  if (WX && WX.live){
    let i = 1;
    while (i < WX.days.length){
      const n = today + i * DAY, wd = new Date(n).getUTCDay(), ev = onDay(n);
      if (wd !== 0 && wd !== 6 && !(ev && (ev.tag === 'closed' || ev.tag === 'break'))) break;
      i++;
    }
    const d = WX.days[i];
    if (d && isWet(d)) auto.unshift({ big: 'Rain ' + (i === 1 ? 'tomorrow' : 'on ' + fmt(today + i * DAY, { weekday: 'long' })) + '.', small: 'Bring a raincoat and an umbrella.' });
  }
  if (dow === 5) auto.push({ big: 'Have a great weekend.', small: 'See you Monday.' });
  REMIND = auto.concat(CONFIG.reminders);
}

/* ---------- turning pages ---------- */
const pages = [...document.querySelectorAll('.page')];
let cur = 0, timer = 0, paused = false;
function show(i){
  cur = (i + pages.length) % pages.length;
  const pg = pages[cur];
  if (pg.classList.contains('p-remind')) buildReminders(laNow().n);
  if (pg.classList.contains('p-remind') && REMIND.length){
    const r = REMIND[rIdx++ % REMIND.length];
    pg.querySelector('h2').textContent = r.big; pg.querySelector('p').textContent = r.small;
  }
  pages.forEach((p, j) => p.classList.toggle('on', j === cur));
  clearTimeout(timer);
  if (!paused) timer = setTimeout(() => show(cur + 1), (+pages[cur].dataset.seconds || CONFIG.pageSeconds) * 1000);
}
$('stage').addEventListener('click', () => show(cur + 1));
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') show(cur + 1);
  else if (e.key === 'ArrowLeft') show(cur - 1);
  else if (e.key === ' '){ e.preventDefault(); paused = !paused; if (paused) clearTimeout(timer); else show(cur); }
});

/* ---------- keep the screen awake (for a Fire Stick or any player that would otherwise start a screensaver) ---------- */
// 1. Ask the browser directly. 2. Also play a tiny silent video on a loop, which most TV players treat as "something is playing".
let wakeLock = null;
async function stayAwake(){
  try {
    if ('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (err) { wakeLock = null; }
  const v = $('awake');
  if (v && v.paused) v.play().catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') stayAwake(); });
setInterval(stayAwake, 30 * 1000);
stayAwake();

/* ---------- go ---------- */
WX = HOSTED ? blankWeather() : sampleWeather();
tick(); renderSky(); show(0);
setInterval(tick, 1000);
loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);
// Reload once a day in the small hours so a new version of the board gets picked up.
setInterval(() => { const t = laNow(); if (t.h === 3 && t.mi === 30) location.reload(); }, 60 * 1000);
</script>
